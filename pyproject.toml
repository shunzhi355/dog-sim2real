[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dog3588"
version = "0.1.0"
description = "Modular Robot12 policy deployment on Orange Pi 5 Max"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7", "onnxruntime>=1.18,<2", "pyserial>=3.5,<4"]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.8,<5"]
i2c = ["smbus2>=0.4,<1"]
tof = ["smbus2>=0.4,<1", "vl53l5cx-ctypes==0.0.3; sys_platform == 'linux'"]
gpio = ["gpiod>=2.1,<3; sys_platform == 'linux'"]
dev = ["pytest>=8,<10", "onnx>=1.16,<2"]
deploy = ["paramiko>=3,<5"]

[project.scripts]
dog3588 = "dog3588.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

